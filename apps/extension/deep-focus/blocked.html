<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Deep Focus is on</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f1226; color: #e8eaf6; }
    main { max-width: 28rem; padding: 2rem; }
    h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
    p { color: #aab0d0; margin: .5rem 0 1.25rem; }
    button { font: inherit; padding: .6rem 1rem; border-radius: .5rem; border: 1px solid #5560a8; background: #7c5cff; color: #fff; cursor: pointer; margin-right: .5rem; }
    button.ghost { background: transparent; color: #e8eaf6; }
  </style>
</head>
<body>
  <main>
    <h1>Deep Focus is on</h1>
    <p>This site is blocked while your EdNova study session is active. Your session keeps counting only while you study.</p>
    <button id="back">Back to my session</button>
    <button id="exit" class="ghost">Emergency exit: turn off Deep Focus</button>
  </main>
  <script src="blocked.js"></script>
</body>
</html>
