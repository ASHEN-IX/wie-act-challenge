# LiteLLM router config (COACH-07).
#
# Structure mirrors the reference repo (hackership-ai): each `model_name` is the
# alias agents call through `utils.llm_client.ask(<alias>, ...)`. API keys are
# referenced from env via `os.environ/KEY` (e.g. GEMINI_API_KEY, GROQ_API_KEY,
# NVIDIA_API_KEY, OPENROUTER_API_KEY). Tune models/fallbacks here without code.
#
# This file is consumed in-process by utils/llm_client.build_router(); it is also
# valid as a LiteLLM proxy-server config (mount it at /app/config.yaml) so the
# same file can power a future `litellm` container.

model_list:

- model_name: nardouch_compact
  litellm_params:
    model: groq/openai/gpt-oss-20b
    temperature: 0.2
    max_tokens: 2400
    timeout: 18
    reasoning_effort: low
    drop_params: true

- model_name: nardouch_capable
  litellm_params:
    model: groq/openai/gpt-oss-120b
    temperature: 0.2
    max_tokens: 2400
    timeout: 18
    drop_params: true

# ————————————————— agent groups (entry points) —————————————————

# COACH — short, frequent nudges: speed + judgement.
- model_name: coach
  litellm_params:
    model: groq/openai/gpt-oss-20b
    api_key: os.environ/GROQ_API_KEY
    temperature: 0.5
    max_tokens: 1024
    reasoning_effort: low
    drop_params: true

# PLANNER — goal decomposition into plans: strong open-weights reasoning.
- model_name: planner
  litellm_params:
    model: groq/openai/gpt-oss-120b
    api_key: os.environ/GROQ_API_KEY
    temperature: 0.3
    max_tokens: 2048
    drop_params: true

# SEARCH — web-result synthesis: long-context + fast.
- model_name: search
  litellm_params:
    model: groq/llama-3.3-70b-versatile
    api_key: os.environ/GROQ_API_KEY
    temperature: 0.2
    max_tokens: 1536
    drop_params: true

# REFLECTION — empathetic, long-form journaling.
- model_name: reflection
  litellm_params:
    model: groq/llama-3.3-70b-versatile
    api_key: os.environ/GROQ_API_KEY
    temperature: 0.7
    max_tokens: 2048
    drop_params: true

# COURSE_INGESTION — deterministic title/entity extraction: small + cheap.
- model_name: course_ingestion
  litellm_params:
    model: groq/openai/gpt-oss-20b
    api_key: os.environ/GROQ_API_KEY
    temperature: 0.1
    max_tokens: 1024
    reasoning_effort: low
    drop_params: true

# Gemini's free tier may use prompts to improve Google's products, so it is kept
# off learner text and only used for consent-gated, non-personal formula crops.
# Research alias, not enabled for generic ask(): processing requires consent,
# durable budget controls, and verification that the project is free-tier.
- model_name: course_multimodal_prototype
  litellm_params:
    model: gemini/gemini-2.5-flash
    api_key: os.environ/GEMINI_API_KEY
    temperature: 0
    max_tokens: 1024

# EVALUATOR — question generation + grading: structured outputs.
- model_name: evaluator
  litellm_params:
    model: groq/openai/gpt-oss-120b
    api_key: os.environ/GROQ_API_KEY
    temperature: 0.3
    max_tokens: 1536
    drop_params: true

# FACILITATOR — peer-first interventions across several learners: capable tier.
- model_name: facilitator
  litellm_params:
    model: groq/openai/gpt-oss-120b
    api_key: os.environ/GROQ_API_KEY
    temperature: 0.5
    max_tokens: 1536
    drop_params: true

# VISUAL LAB SELECTOR — chooses a supported simulation engine or refuses: small + cheap.
- model_name: visual_lab_selector
  litellm_params:
    model: groq/openai/gpt-oss-20b
    api_key: os.environ/GROQ_API_KEY
    temperature: 0.1
    max_tokens: 1024
    reasoning_effort: low
    drop_params: true

# VISUAL LAB PLANNER — configures a course-specific experiment: capable reasoning.
- model_name: visual_lab_planner
  litellm_params:
    model: groq/openai/gpt-oss-120b
    api_key: os.environ/GROQ_API_KEY
    temperature: 0.2
    max_tokens: 2048
    drop_params: true

# COURSE REVIEW — proposes clearer titles and objectives for an extracted draft.
- model_name: course_review
  litellm_params:
    model: groq/openai/gpt-oss-120b
    api_key: os.environ/GROQ_API_KEY
    temperature: 0.2
    max_tokens: 3000
    drop_params: true

# ————————————————— shared fallback providers —————————————————————
# Free-tier only. NOT routed at runtime (an approval binds one exact model, see
# utils/llm_client.build_router); they document the operator's next approvals.
# Groq limits are per model, so the aliases above are spread across models to
# multiply the free quota instead of sharing one 200K-tokens/day bucket.

- model_name: groq-main
  litellm_params:
    model: groq/openai/gpt-oss-120b
    api_key: os.environ/GROQ_API_KEY
    drop_params: true

- model_name: nvidia-main
  litellm_params:
    model: nvidia_nim/meta/llama-3.3-70b-instruct
    api_key: os.environ/NVIDIA_API_KEY
    drop_params: true

- model_name: openrouter-main
  litellm_params:
    model: openrouter/meta-llama/llama-3.3-70b-instruct:free
    api_key: os.environ/OPENROUTER_API_KEY
    drop_params: true

router_settings:
  num_retries: 2
  allowed_fails: 2
  retry_after: 2
  cooldown_time: 30
  fallbacks:
    - coach: [groq-main]
    - planner: [nvidia-main, groq-main]
    - search: [groq-main]
    - reflection: [groq-main]
    - course_ingestion: [nvidia-main]
    - evaluator: [groq-main, nvidia-main]
    - facilitator: [nvidia-main]
    - visual_lab_selector: [groq-main]
    - visual_lab_planner: [groq-main, nvidia-main]
    - course_review: [groq-main, nvidia-main]
