[tool.poetry]
name = "ednova-ai"
version = "0.1.0"
description = "EdNova study and AI worker services"
authors = ["Your Name <kammoun.mohamedaziz@esprit.tn>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11,<3.15"
numpy = {version = ">=2.4.1,<3.0.0"}
# CPU deployment: avoid downloading CUDA libraries for the embedding model.
torch = {version = "2.10.0+cpu", source = "pytorch-cpu", markers = "sys_platform == 'linux' and platform_machine == 'x86_64'"}
sentence-transformers = {version = ">=2.0.0,<3.0.0"}
faiss-cpu = {version = ">=1.7.0,<2.0.0"}
pytesseract = {version = ">=0.3.10,<1.0.0"}
Pillow = {version = ">=10.0.0,<11.0.0"}
PyMuPDF = {version = ">=1.23.0,<2.0.0"}
pymongo = {version = ">=4.6.0,<5.0.0"}
aio-pika = {version = ">=9.6.0,<10.0.0"}
redis = {version = ">=5.0.0,<6.0.0"}
python-multipart = {version = ">=0.0.9,<1.0.0"}
PyJWT = {version = ">=2.8.0,<3.0.0"}
pdf2image = {version = ">=1.17.0,<2.0.0"}
pydantic = {version = ">=2.0.0,<3.0.0"}
requests = {version = ">=2.31.0,<3.0.0"}
litellm = {version = ">=1.40.0,<2.0.0"}
PyYAML = {version = ">=6.0.0,<7.0.0"}
python-dotenv = {version = ">=1.0.0,<2.0.0"}
# MediaPipe also needs this distribution; install only one provider of cv2.
opencv-contrib-python = {version = ">=4.8.0,<5.0.0"}
# Keep the existing TensorFlow version while using its smaller CPU-only build.
tensorflow-cpu = "2.20.0"
fastapi = {version = ">=0.115.0,<1.0.0"}
uvicorn = {version = ">=0.34.0,<1.0.0"}
scipy = {version = ">=1.11.0,<2.0.0"}
mediapipe = {version = ">=0.10.0,<1.0.0"}

beautifulsoup4 = ">=4.12,<5"
google-genai = ">=1,<3"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.2,<10.0.0"
flake8 = ">=7.3.0,<8.0.0"
black = ">=26.1.0,<27.0.0"
mypy = ">=1.19.1,<2.0.0"
pytest-asyncio = ">=0.24"
httpx = ">=0.27.0,<1.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503", "E501"]
exclude = ["__pycache__", ".venv", ".git", "build", "dist"]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["agents", "services", "tests"]
addopts = "-v --import-mode=importlib"
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration (requires live external services)",
]
