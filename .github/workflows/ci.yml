name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  node:
    name: pnpm workspace and modular API
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports: [27018:27017]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: docker build -t mindflow-api .
      - run: docker build -f study-partner-web/Dockerfile -t mindflow-web .
  e2e:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports: [27018:27017]
      mailpit:
        image: axllent/mailpit:v1.31.4
        ports: [1026:1025, 8026:8025]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter study-partner-web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
  ai:
    name: AI (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: study-partner-ai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install locked Python environment
        run: |
          python -m pip install 'poetry>=2,<3'
          poetry check --lock
          poetry install --with dev --no-interaction

      - name: Syntax check
        run: poetry run python -m compileall -q agents bloom messaging models services utils workers

      - name: Worker, contract, inference configuration and SSRF checks
        env:
          LLM_MOCK: "1"
        run: >-
          poetry run python -m pytest
          tests/test_base_worker.py tests/test_session_store.py
          tests/test_ai_envelope_contract.py tests/test_topology_parity.py
          tests/test_prompt_guard.py tests/test_llm_client.py
          tests/test_search_ssrf.py -q
