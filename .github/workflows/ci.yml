name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  ai-container:
    name: Non-root AI image and shared storage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: docker build -t ednova-ai-check -f apps/ai/Dockerfile apps/ai
      - run: node scripts/verify-ai-container.mjs ednova-ai-check
      - run: node scripts/verify-worker-recovery.mjs ednova-ai-check
      - run: node scripts/verify-source-restore.mjs ednova-ai-check
  node:
    name: pnpm workspace and modular API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ednova
          POSTGRES_PASSWORD: ednova
          POSTGRES_DB: ednova_test
        ports: [5433:5432]
        options: >-
          --health-cmd "pg_isready -U ednova -d ednova_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      mongodb:
        image: mongo:7
        ports: [27018:27017]
    env:
      DATABASE_URL: postgresql://ednova:ednova@127.0.0.1:5433/ednova_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generate the Prisma client
        run: pnpm --filter api exec prisma generate
      - name: Apply database migrations
        run: pnpm --filter api exec prisma migrate deploy
      - name: Validate development, test and source storage Compose settings
        run: node scripts/check-compose.mjs
      - name: Verify isolated local setup and repeat safety
        run: node scripts/test-dev-setup.mjs
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ednova
          POSTGRES_PASSWORD: ednova
          POSTGRES_DB: ednova_test
        ports: [5433:5432]
        options: >-
          --health-cmd "pg_isready -U ednova -d ednova_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      mongodb:
        image: mongo:7
        ports: [27018:27017]
      mailpit:
        image: axllent/mailpit:v1.31.4
        ports: [1026:1025, 8026:8025]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
  ai:
    name: AI (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked Python environment
        run: |
          python -m pip install 'poetry==2.5.1'
          poetry check --lock
          poetry install --with dev --no-interaction

      - name: Syntax check
        run: poetry run python -m compileall -q agents bloom messaging models services utils workers

      - name: Worker, contract, inference configuration and SSRF checks
        env:
          LLM_MOCK: "1"
        run: >-
          poetry run python -m pytest
          tests/test_base_worker.py tests/test_session_store.py
          tests/test_ai_envelope_contract.py tests/test_topology_parity.py
          tests/test_prompt_guard.py tests/test_llm_client.py
          tests/test_search_ssrf.py -q
  source-foundation:
    name: Immutable sources and integrated learning
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports: [27018:27017]
      rabbitmq:
        image: rabbitmq:3-management
        ports: [5678:5672]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - name: Locked Python prerequisites
        working-directory: apps/ai
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
          python -m pip install 'poetry==2.5.1'
          poetry install --with dev --no-interaction
          echo "P0R2_PYTHON=$(poetry env info --executable)" >> "$GITHUB_ENV"
      - name: Full offline Python regression and schema drift
        working-directory: apps/ai
        env:
          LLM_MOCK: '1'
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          LITELLM_LOCAL_MODEL_COST_MAP: 'True'
          MONGODB_URI: mongodb://127.0.0.1:27018/ednova_ci_python
          DB_NAME: ednova_ci_python
          P0_BUDGET_TEST_MONGODB_URI: mongodb://127.0.0.1:27018
          P0_DATABASE_TEST_MONGODB_URI: mongodb://127.0.0.1:27018
          PYTHONPATH: ../api/tests/helpers/python_guard:.:agents/evaluator/src
        run: |
          poetry run python -m pytest -q -ra
          poetry run python -m contracts.export_ednova_schema --check
      - name: Real sessions, publication, source, worker and Python HTTP
        env:
          P0R2_BROKER_URL: amqp://guest:guest@127.0.0.1:5678/
        run: >-
          pnpm --filter api exec tsx --tsconfig tsconfig.json --test --test-concurrency=1
          tests/integration/p0r1-trust-boundaries.node.test.ts
          tests/integration/p0r2-source-ai.node.test.ts
          tests/integration/p0r3-learning-rooms.node.test.ts
      - name: Chromium for real integrated learning journeys
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Real institutional, Studio, learner and two-session room journeys
        run: node scripts/run-integrated-browser.mjs
      - name: Four-learner integrated journeys with a PDF original
        env:
          P0R3_SOURCE_PDF: '1'
          P0R3_FOUR_LEARNERS: '1'
          P0R3_EVIDENCE_DIR: ${{ github.workspace }}/reports/evidence/ednova-pdf-ci
        run: node scripts/run-integrated-browser.mjs
      - name: Scanned-PDF OCR and instructor warning through shared learning
        env:
          P0R3_SOURCE_SCANNED: '1'
          P0R3_EVIDENCE_DIR: ${{ github.workspace }}/reports/evidence/ednova-scanned-ci
        run: node scripts/run-integrated-browser.mjs
      - name: Integrated learning evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ednova-p0r3-browser-evidence
          path: |
            reports/evidence/ednova-p0-r3/browser-*
            reports/evidence/ednova-pdf-ci/
            reports/evidence/ednova-scanned-ci/
      - name: Generated adapter stability
        run: |
          pnpm generate:contracts
          git diff --exit-code -- apps/api/src/framework/domains
