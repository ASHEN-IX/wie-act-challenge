services:
  app:
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    environment:
      NODE_ENV: production
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET must be set}
      MONGODB_URI: ${DOCKER_MONGODB_URI:?Set an authenticated production MongoDB URI}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set allowed production origins}
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:?Set a shared AI service key of at least 32 characters}
      AI_SERVICE_URL: ${AI_SERVICE_URL:?Set the independent AI server URL}
      ALLOW_TEST_COUPONS: 'false'
      COUPON_CODES: ''
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set a random authentication secret
        of at least 32 characters}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set the public HTTPS authentication origin}
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:?Set trusted HTTPS origins}
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
  mongodb:
    profiles:
    - local-db
  rabbitmq:
    image: rabbitmq:3
  web:
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1.0'
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set a random authentication secret
        of at least 32 characters}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set the public HTTPS authentication origin}
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:?Set trusted HTTPS origins}
      SMTP_HOST: ${SMTP_HOST:?Set production SMTP host}
      SMTP_PORT: ${SMTP_PORT:-587}
  mailpit:
    profiles:
    - development-mail

  frontend:
    ports: !override []
    volumes:
      - ./study-partner-web/nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set the public HTTPS domain}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
volumes:
  caddy_data:
  caddy_config:
