name: ednova-tests
services:
  postgres:
    image: postgres:17-alpine
    ports: ['127.0.0.1:5433:5432']
    environment:
      POSTGRES_USER: ednova
      POSTGRES_PASSWORD: ednova
      POSTGRES_DB: ednova_test
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ednova -d ednova_test']
      interval: 5s
      timeout: 5s
      retries: 12
  mailpit:
    image: axllent/mailpit:v1.31.4
    ports: ['127.0.0.1:1026:1025', '127.0.0.1:8026:8025']
