name: ednova-dev
services:
  postgres:
    image: postgres:17-alpine
    ports: ['127.0.0.1:5433:5432']
    environment:
      POSTGRES_USER: ednova
      POSTGRES_PASSWORD: ednova
      POSTGRES_DB: ednova
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ednova -d ednova']
      interval: 5s
      timeout: 5s
      retries: 12
  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ednova
      RABBITMQ_DEFAULT_PASS: ednova-local
      RABBITMQ_DEFAULT_VHOST: ednova
    ports: ['127.0.0.1:5673:5672', '127.0.0.1:15673:15672']
    volumes: ['rabbit-data:/var/lib/rabbitmq']
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 10s
      retries: 12
  redis:
    image: redis:7-alpine
    ports: ['127.0.0.1:6381:6379']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 12
  mailpit:
    image: axllent/mailpit:v1.31.4
    ports: ['127.0.0.1:1026:1025', '127.0.0.1:8026:8025']
volumes:
  postgres-data:
  rabbit-data:
