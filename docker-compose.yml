name: ednova-api
services:
  ai-service:
    build:
      context: ./apps/ai
      dockerfile: Dockerfile
    container_name: ednova-ai
    restart: unless-stopped
    ports:
    - 127.0.0.1:8000:8000
    env_file:
    - path: ./apps/ai/.env
      required: false
    environment:
      MONGODB_URI: mongodb://mongodb:27017/${AI_DB_NAME:-ednova}
      DB_NAME: ${AI_DB_NAME:-ednova}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-ednova}:${RABBITMQ_PASS:?RABBITMQ_PASS
        must be set}@rabbitmq:5672/${RABBITMQ_VHOST:-ednova}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_MOCK: ${LLM_MOCK:-0}
      APP_ENV: production
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app:/app/agents/evaluator
      INGEST_UPLOADS_DIR: /app/uploads
      FAISS_INDEX_DIR: /app/faiss
      LLM_APPROVALS_JSON: ${LLM_APPROVALS_JSON:-}
      LLM_BUDGET_MONGODB_URI: ${LLM_BUDGET_MONGODB_URI:-}
      LLM_BUDGET_DB_NAME: ${LLM_BUDGET_DB_NAME:-}
    extra_hosts:
    - host.docker.internal:host-gateway
    volumes:
    # Both the ingestion worker and the authenticated source-preparation HTTP
    # endpoint create revision artifacts on this shared volume.
    # Host sources must match the API's INGEST_UPLOADS_DIR / FAISS_INDEX_DIR
    # (see .env); otherwise the worker cannot see uploaded originals.
    - ${FAISS_INDEX_DIR:-./var/dev-faiss}:/app/faiss
    - ${INGEST_UPLOADS_DIR:-./var/dev-uploads}:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    working_dir: /app
    # Keep runtime caches writable when a bind-mounted desktop workspace has
    # different ownership from the container's non-root worker user.
    tmpfs:
    - /tmp:size=64m
    - /home/ednova/.config:size=64m
    command: uvicorn services.api.main:app --host 0.0.0.0 --port 8000 --workers 2
  ingestion-worker:
    extends:
      service: ai-service
    container_name: ednova-ingestion-worker
    # The worker previously inherited a stale prebuilt image tag from an older
    # compose file, which silently omitted current worker code. Both services
    # must use the same freshly built application image.
    image: ednova-api-ai-service:latest
    ports: !reset []
    healthcheck:
      disable: true
    command: python -m workers.ingestion_worker
  evaluator-worker:
    extends:
      service: ingestion-worker
    container_name: ednova-evaluator-worker
    command: python -m workers.evaluator_worker
  planner-worker:
    extends:
      service: ingestion-worker
    container_name: ednova-planner-worker
    command: python -m workers.planner_worker
  search-worker:
    extends:
      service: ingestion-worker
    container_name: ednova-search-worker
    command: python -m workers.search_worker
  schedule-worker:
    extends:
      service: ingestion-worker
    container_name: ednova-schedule-worker
    command: python -m workers.schedule_worker
  coach-worker:
    extends:
      service: ingestion-worker
    container_name: ednova-coach-worker
    command: python -m workers.coach_worker

  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
    - 127.0.0.1:27017:27017
    volumes:
    - mongodb_data:/data/db
    healthcheck:
      test:
      - CMD
      - mongosh
      - --quiet
      - --eval
      - db.adminCommand('ping')
      interval: 10s
      timeout: 5s
      retries: 6
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync always
    volumes:
    - redis_data:/data
    ports:
    - 127.0.0.1:6379:6379
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 3
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ednova}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?RABBITMQ_PASS must be set}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-ednova}
    ports:
    - 127.0.0.1:5672:5672
    - 127.0.0.1:15672:15672
    volumes:
    - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
  mailpit:
    image: axllent/mailpit:v1.31.4
    restart: unless-stopped
    ports:
    - 127.0.0.1:8025:8025
    - 127.0.0.1:1025:1025
volumes:
  redis_data:
    name: ednova_redis_data
    external: true
  mongodb_data:
    name: ednova_mongodb_data
    external: true
  rabbitmq_data:
    name: ednova_rabbitmq_data
    external: true
  revision_faiss:
    name: ednova_revision_faiss
  study_uploads:
    name: ednova_uploads
    external: true
