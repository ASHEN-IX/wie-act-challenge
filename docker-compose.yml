name: study-partner-api
services:
  ai-service:
    build:
      context: ./apps/ai
      dockerfile: Dockerfile
    container_name: mindflow-ai
    restart: unless-stopped
    ports:
    - 127.0.0.1:8000:8000
    env_file:
    - path: ./apps/ai/.env
      required: false
    environment:
      MONGODB_URI: mongodb://mongodb:27017/study_partner_ai
      DB_NAME: ${AI_DB_NAME:-study_partner_ai}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-mindflow}:${RABBITMQ_PASS:?RABBITMQ_PASS
        must be set}@rabbitmq:5672/${RABBITMQ_VHOST:-mindflow}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_MOCK: ${LLM_MOCK:-0}
      APP_ENV: production
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app:/app/agents/evaluator
      INGEST_UPLOADS_DIR: /app/uploads
      FAISS_INDEX_DIR: /app/faiss
      LLM_APPROVALS_JSON: ${LLM_APPROVALS_JSON:-}
    extra_hosts:
    - host.docker.internal:host-gateway
    volumes:
    # Both the ingestion worker and the authenticated source-preparation HTTP
    # endpoint create revision artifacts on this shared volume.
    - revision_faiss:/app/faiss
    - study_uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    working_dir: /app
    command: uvicorn services.api.main:app --host 0.0.0.0 --port 8000 --workers 2
  ingestion-worker:
    extends:
      service: ai-service
    container_name: mindflow-ingestion-worker
    ports: !reset []
    healthcheck:
      disable: true
    command: python -m workers.ingestion_worker
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
    - 127.0.0.1:27017:27017
    volumes:
    - mongodb_data:/data/db
    healthcheck:
      test:
      - CMD
      - mongosh
      - --quiet
      - --eval
      - db.adminCommand('ping')
      interval: 10s
      timeout: 5s
      retries: 6
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync always
    volumes:
    - redis_data:/data
    ports:
    - 127.0.0.1:6379:6379
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 3
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-mindflow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?RABBITMQ_PASS must be set}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-mindflow}
    ports:
    - 127.0.0.1:5672:5672
    - 127.0.0.1:15672:15672
    volumes:
    - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
  mailpit:
    image: axllent/mailpit:v1.31.4
    restart: unless-stopped
    ports:
    - 127.0.0.1:8025:8025
    - 127.0.0.1:1025:1025
volumes:
  redis_data: null
  mongodb_data: null
  rabbitmq_data: null
  revision_faiss:
    name: ednova_revision_faiss
  study_uploads: null
