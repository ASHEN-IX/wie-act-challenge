# Separate lifecycle: docker compose --env-file .env.ai -f docker-compose.ai.yml up -d
name: ednova-ai
services:
  ai-service:
    build:
      context: ./apps/ai
      dockerfile: Dockerfile
    ports:
      - '127.0.0.1:8000:8000'
    env_file:
      - path: ./apps/ai/.env
        required: false
    environment:
      AI_DATABASE_URL: ${AI_DATABASE_URL:?Set the AI service PostgreSQL URI (schema ai)}
      API_SERVICE_URL: ${API_SERVICE_URL:?Set the reachable API base URL}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?Set the shared internal service secret}
      RABBITMQ_URL: ${AI_RABBITMQ_URL:?Set the reachable AI broker URI}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      NARDOUCH_SPEECH_MODEL_DIR: /models/nardouch
      NARDOUCH_TTS_BUDGET_DB: /app/tts-state/elevenlabs.sqlite3
      NARDOUCH_ASR_PROVIDER: local_whisper
      NARDOUCH_TTS_PROVIDER: ${NARDOUCH_TTS_PROVIDER:-vibi}
      LLM_MOCK: ${LLM_MOCK:-0}
      APP_ENV: production
      REDIS_URL: ${AI_REDIS_URL:?Set the reachable durable AI Redis URI}
      PYTHONPATH: /app:/app/agents/evaluator
      INGEST_UPLOADS_DIR: /app/uploads
      FAISS_INDEX_DIR: /app/faiss
      LLM_APPROVALS_JSON: ${LLM_APPROVALS_JSON:-}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - study_uploads:/app/uploads
      - revision_faiss:/app/faiss
      - ./var/nardouch-models:/models/nardouch:ro
      - ./var/nardouch-tts-state:/app/tts-state
    working_dir: /app
    command: uvicorn services.api.main:app --host 0.0.0.0 --port 8000 --workers 1
    restart: unless-stopped
  ingestion-worker:
    extends:
      service: ai-service
    ports: !reset []
    healthcheck:
      disable: true
    command: python -m workers.ingestion_worker
volumes:
  revision_faiss:
    name: ednova_revision_faiss
  study_uploads:
    external: true
    name: ednova_uploads
